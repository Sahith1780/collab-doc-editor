name: SyncDoc CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: CRDT Convergence & Verification Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Convergence & Partition Recovery Test Suite
        run: node test/convergence.test.js

      - name: Run CRDT Memory Footprint & Throughput Benchmark
        run: node test/memory-benchmark.js
